[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "staydbrain"
version = "0.2.0"
description = "Security-first local persistent memory for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
staydbrain = "agent_brain.cli:main"
agent-brain = "agent_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
